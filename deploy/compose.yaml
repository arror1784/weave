# 운영 배포 — Lightsail 서버 1대에 DB·서버·Caddy(HTTPS, 웹 정적 파일)를 함께 띄운다(사용자 결정 2026-10-17).
# 비밀값은 같은 폴더의 .env(커밋 금지)에서 읽는다 — 목록은 .env.example.
# 실행: docker compose up -d   (웹 정적 파일은 ./web, 서버 이미지는 weave-server:latest)
services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: weave
      POSTGRES_USER: weave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 넣어 주세요}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weave -d weave"]
      interval: 5s
      retries: 20

  server:
    image: weave-server:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/weave
      SPRING_DATASOURCE_USERNAME: weave
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 .env에 넣어 주세요}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HOLIDAY_API_KEY: ${HOLIDAY_API_KEY:-}
      TZ: Asia/Seoul
    volumes:
      - uploads:/data/uploads

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS를 .env에 넣어 주세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

spring:
  application:
    name: weave
  config:
    # Spring Boot는 .env를 자동으로 읽지 않는다 — 없으면 ${...}를 못 풀어 부팅 실패(§3-1)
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway만 바꾼다
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

weave:
  jwt:
    # 32바이트 이상 임의 문자열 — .env의 JWT_SECRET
    secret: ${JWT_SECRET}
  storage:
    root: ${WEAVE_STORAGE_ROOT:uploads}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}

spring.servlet.multipart:
  # 사용자 결정: 첨부 파일당 10MB
  max-file-size: 10MB
  max-request-size: 11MB

# 테스트 전용 값 — 실제 비밀값이 아니다
weave:
  jwt:
    secret: test-secret-test-secret-test-secret-0123456789
  storage:
    root: build/test-uploads
  anthropic:
    api-key: test-key
  defaults:
    # 기존 일정 테스트들은 하루 3시간을 전제로 숫자를 맞췄다 — 운영 값(8)은 PersonalEventIntegrationTest가 application.yml에서 확인한다
    available-hours: 3
  holiday:
    # 테스트는 실제 공휴일 API를 부르지 않는다 — .env에 키가 있어도 비운다(서버 시작 때 동기화가 돌지 않게)
    api-key: ""
  rate-limit:
    # 통합 테스트는 모두 같은 IP(127.0.0.1)로 가입을 많이 한다 — 끄고, RateLimitIntegrationTest만 작은 한도로 켠다
    enabled: false

# 테스트 — main 푸시와 PR마다 돈다(사용자 결정 2026-10-20). release 배포(deploy.yml)는 같은 커밋이 여기서 통과했는지만 보고 테스트를 다시 돌리지 않는다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # main 실행은 취소하지 않는다 — 배포가 그 커밋의 결과를 기다린다
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: 백엔드 빌드·테스트 (Testcontainers는 러너의 Docker 사용)
        working-directory: backend
        run: ./gradlew build
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 웹 테스트·빌드
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

# 운영 배포 — release 브랜치에 푸시하면 Lightsail 서버에 반영한다(사용자 결정 2026-10-20).
# 테스트는 다시 돌리지 않는다: 같은 커밋이 main에서 ci.yml을 통과했는지 확인하고(돌고 있으면 기다림), 통과한 커밋만 배포한다.
# 필요한 설정(저장소 Settings → Environments → production): Secrets DEPLOY_HOST(서버 IP) · DEPLOY_SSH_KEY(배포 전용 개인 키) ·
#   DEPLOY_KNOWN_HOSTS(서버 호스트 키) / Variables DEPLOY_URL(https://… 헬스체크 주소)
# 서버는 이미지를 받을 때만 이 작업의 GITHUB_TOKEN으로 GHCR에 로그인하고 바로 로그아웃한다 — 서버에 오래 사는 토큰을 두지 않는다.
name: deploy

on:
  push:
    branches: [release]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/weave-server

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: 이 커밋이 main 테스트(ci)를 통과했는지 확인 — 돌고 있으면 최대 20분 기다린다
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 60); do
            result=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&event=push&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status // "none")/\(.conclusion // "-")"')
            case "$result" in
              completed/success) echo "테스트 통과한 커밋이에요"; exit 0 ;;
              completed/*) echo "이 커밋의 테스트가 실패했어요($result) — 배포하지 않아요"; exit 1 ;;
              none/*) echo "이 커밋을 main에서 테스트한 기록이 없어요 — main에 먼저 머지·푸시한 뒤 release로 옮기세요"; exit 1 ;;
            esac
            echo "테스트 진행 중($result) — 20초 뒤 다시 확인"
            sleep 20
          done
          echo "20분 안에 테스트가 끝나지 않았어요"; exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      # v6은 캐시 기능이 별도 상용 약관(gradle-actions-caching)이라 사용자가 정하기 전까지 v5(MIT, Node 24)
      - uses: gradle/actions/setup-gradle@v5
      - name: 서버 jar (테스트는 ci에서 끝남)
        working-directory: backend
        run: ./gradlew bootJar
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 웹 빌드
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 서버 이미지 → GHCR (커밋별 태그 + latest)
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: SSH 준비
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: 설정·웹 파일 복사 (.env·데이터 볼륨은 건드리지 않는다)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          rm -rf deploy/web && cp -R web/dist deploy/web
          tar -C deploy -czf - compose.yaml Caddyfile backup.sh remote-deploy.sh web \
            | ssh -i ~/.ssh/deploy_key ubuntu@"$HOST" \
                'rm -rf ~/weave/.incoming && mkdir -p ~/weave/.incoming && tar -C ~/weave/.incoming -xzf -'
      - name: 이미지 받고 다시 띄우기 (deploy/remote-deploy.sh)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/deploy_key ubuntu@"$HOST" \
            "bash ~/weave/.incoming/remote-deploy.sh '${{ env.IMAGE }}:${{ github.sha }}' '${{ github.actor }}'"
      - name: 헬스체크 (밖에서 HTTPS로)
        env:
          URL: ${{ vars.DEPLOY_URL }}
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "$URL/actuator/health"; then echo "서버가 떴어요"; exit 0; fi
            sleep 5
          done
          echo "헬스체크 실패 — 서버에서 docker compose logs server 로 확인"; exit 1

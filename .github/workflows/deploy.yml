# 운영 배포 — release 브랜치에 머지(푸시)하면 테스트 → 이미지(GHCR) → Lightsail 서버 반영(사용자 결정 2026-10-20).
# 필요한 설정(저장소 Settings → Environments → production): Secrets DEPLOY_HOST(서버 IP) · DEPLOY_SSH_KEY(배포 전용 개인 키) ·
#   DEPLOY_KNOWN_HOSTS(서버 호스트 키) / Variables DEPLOY_URL(https://… 헬스체크 주소)
# 서버는 이미지를 받을 때만 이 작업의 GITHUB_TOKEN으로 GHCR에 로그인하고 바로 로그아웃한다 — 서버에 오래 사는 토큰을 두지 않는다.
name: deploy

on:
  push:
    branches: [release]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/weave-server

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: 백엔드 빌드·테스트 (Testcontainers는 러너의 Docker 사용)
        working-directory: backend
        run: ./gradlew build
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 웹 테스트·빌드
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: backend/build/libs/weave-*.jar
          retention-days: 7

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: server-jar
          path: backend/build/libs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 서버 이미지 → GHCR (커밋별 태그 + latest)
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: deploy/web
      - name: SSH 준비
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: 설정·웹 파일 복사 (.env·데이터 볼륨은 건드리지 않는다)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          tar -C deploy -czf - compose.yaml Caddyfile backup.sh remote-deploy.sh web \
            | ssh -i ~/.ssh/deploy_key ubuntu@"$HOST" \
                'rm -rf ~/weave/.incoming && mkdir -p ~/weave/.incoming && tar -C ~/weave/.incoming -xzf -'
      - name: 이미지 받고 다시 띄우기 (deploy/remote-deploy.sh)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/deploy_key ubuntu@"$HOST" \
            "bash ~/weave/.incoming/remote-deploy.sh '${{ env.IMAGE }}:${{ github.sha }}' '${{ github.actor }}'"
      - name: 헬스체크 (밖에서 HTTPS로)
        env:
          URL: ${{ vars.DEPLOY_URL }}
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "$URL/actuator/health"; then echo "서버가 떴어요"; exit 0; fi
            sleep 5
          done
          echo "헬스체크 실패 — 서버에서 docker compose logs server 로 확인"; exit 1
